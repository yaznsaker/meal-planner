
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>مخطط الوجبات | Meal Planner 1.1</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>مخطط الوجبات</h1>
      <span id="status">v1.1</span>
    </header>

    <section class="card">
      <h2>بيانات الشخص</h2>
      <div class="grid">
        <label>الوزن (كغ)
          <input id="weight" type="number" value="85" min="20" max="400">
        </label>
        <label>الطول (سم)
          <input id="height" type="number" value="180" min="100" max="230">
        </label>
        <label>العمر
          <input id="age" type="number" value="30" min="10" max="100">
        </label>
        <label>الجنس
          <select id="sex">
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
          </select>
        </label>
        <label>النشاط
          <select id="activity">
            <option value="1.2">قليل 1.2</option>
            <option value="1.375">خفيف 1.375</option>
            <option value="1.55" selected>متوسط 1.55</option>
            <option value="1.725">عالٍ 1.725</option>
            <option value="1.9">عالٍ جدًا 1.9</option>
          </select>
        </label>
        <label>الهدف
          <select id="goal">
            <option value="lose">خسارة الوزن</option>
            <option value="maintain">المحافظة على الوزن</option>
            <option value="gain">زيادة الوزن</option>
          </select>
        </label>
      </div>
      <button id="calc">احسب الاحتياج</button>
      <div id="calcOut" aria-live="polite"></div>
    </section>

    <section class="card">
      <h2>خطة الوجبات</h2>
      <div class="grid">
        <label>السعرات (kcal)
          <input id="kcal" type="number" value="2240" min="1">
        </label>
        <label>البروتين (غ)
          <input id="protein" type="number" value="153" min="1">
        </label>
        <label>الكربوهيدرات (غ)
          <input id="carbs" type="number" value="254" min="1">
        </label>
        <label>الدهون (غ)
          <input id="fat" type="number" value="68" min="1">
        </label>
        <label>عدد الأيام
          <select id="days">
            <option value="1">يوم واحد</option>
            <option value="3">3 أيام</option>
            <option value="7" selected>7 أيام</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="plan">إنشاء خطة يومية</button>
        <button id="week">إنشاء خطة أسبوعية</button>
      </div>
      <div class="actions export-actions">
  <button id="print" type="button">🖨️ طباعة الخطة</button>
  <button id="export" type="button">📥 تصدير الخطة</button>
</div>
<div id="out" aria-live="polite"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
