<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Meal Planner 1.1</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><header><h1>مخطط الوجبات</h1><span id="status">v1.1</span></header><section class="card"><h2>بيانات الشخص</h2><div class="grid"><label>الوزن كغ<input id="weight" type="number" value="85" min="20" max="400"></label><label>الطول سم<input id="height" type="number" value="180" min="100" max="230"></label><label>العمر<input id="age" type="number" value="30" min="10" max="100"></label><label>الجنس<select id="sex"><option value="male">ذكر</option><option value="female">أنثى</option></select></label><label>النشاط<select id="activity"><option value="1.2">قليل 1.2</option><option value="1.375">خفيف 1.375</option><option value="1.55" selected>متوسط 1.55</option><option value="1.725">عالٍ 1.725</option><option value="1.9">عالٍ جدًا 1.9</option></select></label><label>الهدف<select id="goal"><option value="lose">خسارة</option><option value="maintain">ثبات</option><option value="gain">زيادة</option></select></label></div><button id="calc">احسب الاحتياج</button><div id="calcOut"></div></section><section class="card"><h2>الخطة</h2><div class="grid"><label>السعرات<input id="kcal" type="number" value="2240"></label><label>البروتين غ<input id="protein" type="number" value="153"></label><label>الكربوهيدرات غ<input id="carbs" type="number" value="254"></label><label>الدهون غ<input id="fat" type="number" value="68"></label><label>الأيام<select id="days"><option>1</option><option selected>7</option></select></label></div><div class="actions"><button id="plan">خطة يومية</button><button id="week">خطة أسبوعية</button></div>script src="/app.js"></s<div id="out" aria-live="polite"></div></section></main></body></html>
